[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synaptik"
version = "0.4.1"
description = "Evidence-structure analysis for iPSC-neuron research: experiment lookup, phenotype-to-pathway inference, and reconciliation of literature, splice prediction, and population genetics"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "pydantic>=2.0",
    "requests>=2.28",
    "lxml>=4.9",
    "scipy>=1.10",
    "numpy>=1.24",
    "flask>=3.0",
]

[project.urls]
Homepage = "https://github.com/Fr4n0b/synaptik"
Documentation = "https://github.com/Fr4n0b/synaptik/blob/main/docs/RUNBOOK.md"
Issues = "https://github.com/Fr4n0b/synaptik/issues"

[project.optional-dependencies]
extraction = ["anthropic>=0.40"]
server = ["gunicorn>=21.0"]

[project.scripts]
synaptik = "synaptik.cli.main:main"

[tool.setuptools.packages.find]
include = ["synaptik*"]

[tool.setuptools.package-data]
synaptik = ["ui/static/*"]
